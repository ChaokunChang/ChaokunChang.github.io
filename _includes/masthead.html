{% include base_path %}

<header class="site-header">
  <div class="site-shell site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Chaokun Chang, home">
      <span class="site-brand__name">Chaokun Chang</span>
      <span class="site-brand__role">Systems for AI</span>
    </a>

    <details class="site-nav-shell">
      <summary>Menu</summary>
      <nav class="site-nav" aria-label="Primary navigation">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' or link.url contains 'mailto:' %}
            {% assign nav_url = link.url %}
          {% else %}
            {% assign nav_url = link.url | relative_url %}
          {% endif %}
          <a href="{{ nav_url }}">{{ link.title }}</a>
        {% endfor %}
      </nav>
    </details>
  </div>
</header>
