---
layout: default
---

<main id="main-content" class="academic-page">
  <header class="academic-page__header site-shell">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
  </header>
  <div class="academic-page__body site-shell">
    {{ content }}
  </div>
</main>
